extractor: llm

model:
  name: google/gemma-2-2b
  device_map: auto

dataset:
  name: wikipedia
  path: data/wikipedia/20231101.en/*.parquet
  text_field: text

extraction:
  mode: continuous
  position: post_feedforward_layernorm_output
  layers: [0, 5, 10, 15, 20, 25]
  chunk_size: 2048
  target_token_count: 1048576
  forward_batch_chunks: 1
  chunks_per_shard: 32
  prepend_bos: true
  separator: "\n\n"
  save_token_strings: true
  device: cuda

output:
  root: data/representations
  dtype: float32
