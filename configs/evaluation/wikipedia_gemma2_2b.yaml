experiment:
  dataset: Wikipedia
  model: google/gemma-2-2b
  position: post_feedforward_layernorm_output
  layers: [0, 5, 10, 15, 20, 25]

representations:
  format: layer_shards
  path_template: data/representations/wikipedia/google__gemma-2-2b/post_feedforward_layernorm_output/layer_{layer}
  max_samples: 300000

# v6 standardization: match the per-vector RMS preprocessing used by the shared training scripts.
preprocessing:
  normalization: rms
  eps: 1.0e-8

sae:
  source: trained
  # The architecture-specific fields are merged from configs/sae/*.yaml.
  # Each training run directory should contain run_summary.json.
  run_dir_template: saved_models/wikipedia/gemma2-2b/{architecture}/layer_{layer}

evaluation:
  device: cuda
  stats_batch_size: 16384
  inference_batch_size: 4096
  save_sparse_activations: true
  stability:
    max_mu_samples: 5000000
    pair_batch_size: 500000
    random_seed: 42
    save_mu_samples: false
    metric_policy: auto
    singular_policy: pinv
    full_metric_chunk_size: 4096

output:
  root: results/fidelity_stability/Wikipedia/gemma2-2b/{architecture}
