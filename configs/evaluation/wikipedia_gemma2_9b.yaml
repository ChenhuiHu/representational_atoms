experiment:
  dataset: Wikipedia
  model: google/gemma-2-9b
  position: post_feedforward_layernorm_output
  layers: [0, 8, 16, 24, 32, 40]

representations:
  format: layer_shards
  path_template: data/representations/wikipedia/google__gemma-2-9b/post_feedforward_layernorm_output/layer_{layer}
  max_samples: 300000

preprocessing:
  normalization: rms
  eps: 1.0e-8

sae:
  source: trained
  run_dir_template: saved_models/wikipedia/gemma2-9b/{architecture}/layer_{layer}

evaluation:
  device: cuda
  stats_batch_size: 16384
  inference_batch_size: 4096
  save_sparse_activations: true
  stability:
    max_mu_samples: 5000000
    pair_batch_size: 500000
    random_seed: 42
    save_mu_samples: false
    metric_policy: auto
    singular_policy: pinv
    full_metric_chunk_size: 4096

output:
  root: results/fidelity_stability/Wikipedia/gemma2-9b/{architecture}
