experiment:
  dataset: Wikidata
  model: google/gemma-2-9b
  position: post_feedforward_layernorm_output
  layers: [0, 8, 16, 24, 32, 40]
sae:
  architecture: bijumprelu
sparse_activations:
  path_template: results/fidelity_stability/Wikidata/gemma2-9b/{architecture}/layer_{layer}/sae_activations.pt
source:
  type: entity
  format: layer_shards
  path_template: data/representations/wikidata/google__gemma-2-9b/post_feedforward_layernorm_output/layer_{layer}
candidate_mining:
  top_k_examples: 10000
  min_feature_occurrences: 1
  feature_pool_size: 500
  feature_pool_seed: 42
review:
  example_source: top_absolute_examples
  features_per_condition: 10
  examples_per_feature: 10
  random_seed: 42
  judge: llm_as_judge_with_manual_verification
  score_definition: largest_coherent_group_fraction
output:
  root: results/monosemanticity/Wikidata/gemma2-9b/{architecture}
