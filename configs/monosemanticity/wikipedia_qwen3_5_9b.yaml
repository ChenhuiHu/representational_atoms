experiment:
  dataset: Wikipedia
  model: Qwen/Qwen3.5-9B
  position: down_proj_output
  layers: [0, 6, 12, 18, 24, 30]
sae:
  architecture: bijumprelu
sparse_activations:
  path_template: results/fidelity_stability/Wikipedia/qwen3.5-9b/{architecture}/layer_{layer}/sae_activations.pt
source:
  type: wikipedia
  representation_root: data/representations/wikipedia/Qwen__Qwen3.5-9B/down_proj_output
  tokenizer: Qwen/Qwen3.5-9B
  context_window: 32
candidate_mining:
  top_k_examples: 10000
  min_feature_occurrences: 1
  # Matches 3.3.1: a 500-feature storage pool is sampled first.
  feature_pool_size: 500
  feature_pool_seed: 42
review:
  example_source: top_absolute_examples
  features_per_condition: 10
  examples_per_feature: 10
  random_seed: 42
  judge: llm_as_judge_with_manual_verification
  score_definition: largest_coherent_group_fraction
output:
  root: results/monosemanticity/Wikipedia/qwen3.5-9b/{architecture}
